<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USB Stream Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
      border-bottom: 1px solid #222;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #fff;
    }

    #status-badge {
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      background: #1e1e1e;
      color: #888;
      border: 1px solid #333;
      transition: all 0.3s;
    }
    #status-badge.connected    { background: #0d2e1a; color: #4caf82; border-color: #2a6648; }
    #status-badge.disconnected { background: #2e0d0d; color: #cf6679; border-color: #6b2233; }
    #status-badge.connecting   { background: #1e1a0d; color: #cfb046; border-color: #6b5a22; }

    #screen-wrap {
      width: 100%;
      max-width: 900px;
      height: 70vh;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #screen {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none; /* Let events pass through to wrap */
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #444;
      font-size: 0.9rem;
      pointer-events: none;
    }
    #placeholder svg { opacity: 0.3; }

    /* Navigation buttons */
    #nav-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 0;
      margin-top: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #222;
    }

    .nav-btn {
      flex: 1;
      padding: 14px 0;
      background: #161616;
      border: none;
      color: #888;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-right: 1px solid #222;
    }
    .nav-btn:last-child { border-right: none; }
    .nav-btn:hover { background: #222; color: #fff; }
    .nav-btn:active { background: #333; color: #fff; }
    .nav-btn span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }

    #controls {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    #ws-url-display {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #666;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-connect    { background: #1a6e46; color: #fff; }
    #btn-disconnect { background: #6e1a2a; color: #fff; }
    #btn-fullscreen { background: #2a2a2a; color: #ccc; border: 1px solid #444; }

    #privacy-log {
      width: 100%;
      max-width: 900px;
      margin-top: 14px;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.75rem;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #555;
      max-height: 120px;
      overflow-y: auto;
    }
    #privacy-log .entry { margin-bottom: 4px; }
    #privacy-log .ok    { color: #3d8f62; }
    #privacy-log .warn  { color: #8f7a3d; }
    #privacy-log .info  { color: #3d6e8f; }

    /* Touch ripple effect */
    .touch-ripple {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(76, 175, 130, 0.4);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple 0.4s ease-out forwards;
    }
    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>⬛ USB Stream Viewer</h1>
  <span id="status-badge" class="disconnected">Disconnected</span>
</header>

<div id="screen-wrap">
  <img id="screen" alt="device screen" style="display:none" />
  <div id="placeholder">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
      <line x1="12" y1="18" x2="12.01" y2="18"/>
    </svg>
    <span>Waiting for stream…</span>
  </div>
</div>

<!-- On-screen navigation buttons -->
<div id="nav-bar">
  <button class="nav-btn" id="btn-back" title="Back">◁ <span>Back</span></button>
  <button class="nav-btn" id="btn-home" title="Home">○ <span>Home</span></button>
  <button class="nav-btn" id="btn-recents" title="Recents">□ <span>Recents</span></button>
</div>

<div id="controls">
  <span id="ws-url-display">—</span>
  <button id="btn-connect">Connect</button>
  <button id="btn-disconnect" disabled>Disconnect</button>
  <button id="btn-fullscreen">⛶ Fullscreen</button>
</div>

<div id="privacy-log">
  <div class="entry info">[ privacy log ] EXIF stripping active on all received frames.</div>
</div>

<script>
  const screen$    = document.getElementById('screen');
  const screenWrap = document.getElementById('screen-wrap');
  const placeholder= document.getElementById('placeholder');
  const badge      = document.getElementById('status-badge');
  const log        = document.getElementById('privacy-log');
  const btnConn    = document.getElementById('btn-connect');
  const btnDisc    = document.getElementById('btn-disconnect');
  const btnFull    = document.getElementById('btn-fullscreen');
  const wsDisplay  = document.getElementById('ws-url-display');

  let ws        = null;
  let frameCount= 0;
  let fpsTimer  = null;
  let deviceWidth = 1080;   // Updated from server on connect
  let deviceHeight= 1920;   // Updated from server on connect

  // ── Coordinate Mapping (handles object-fit: contain correctly) ───────────
  function getDeviceCoordinates(clientX, clientY) {
    const imgRect = screen$.getBoundingClientRect();
    const wrapRect = screenWrap.getBoundingClientRect();
    
    // The <img> with object-fit:contain may not fill its bounding box.
    // We need to calculate the actual rendered image area within the element.
    const imgNaturalW = screen$.naturalWidth || 1;
    const imgNaturalH = screen$.naturalHeight || 1;
    const imgAspect = imgNaturalW / imgNaturalH;
    
    let renderW, renderH, offsetX, offsetY;
    
    if (imgRect.width / imgRect.height > imgAspect) {
      // Image is constrained by height (pillarboxed)
      renderH = imgRect.height;
      renderW = renderH * imgAspect;
      offsetX = imgRect.left + (imgRect.width - renderW) / 2;
      offsetY = imgRect.top;
    } else {
      // Image is constrained by width (letterboxed)
      renderW = imgRect.width;
      renderH = renderW / imgAspect;
      offsetX = imgRect.left;
      offsetY = imgRect.top + (imgRect.height - renderH) / 2;
    }
    
    // Map click position to device coordinates
    const relX = (clientX - offsetX) / renderW;
    const relY = (clientY - offsetY) / renderH;
    
    // Clamp to valid range
    if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return null;
    
    return {
      x: Math.round(relX * deviceWidth),
      y: Math.round(relY * deviceHeight)
    };
  }

  function sendControl(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(data));
    }
  }

  // ── Touch ripple visual feedback ─────────────────────────────────────────
  function showRipple(clientX, clientY) {
    const rect = screenWrap.getBoundingClientRect();
    const ripple = document.createElement('div');
    ripple.className = 'touch-ripple';
    ripple.style.left = (clientX - rect.left) + 'px';
    ripple.style.top = (clientY - rect.top) + 'px';
    screenWrap.appendChild(ripple);
    setTimeout(() => ripple.remove(), 400);
  }

  // ── Mouse/Touch Control ──────────────────────────────────────────────────
  let touchStart = null;
  let touchStartTime = 0;
  let longPressTimer = null;

  screenWrap.addEventListener('mousedown', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    e.preventDefault();
    const coords = getDeviceCoordinates(e.clientX, e.clientY);
    if (!coords) return;
    touchStart = { coords, clientX: e.clientX, clientY: e.clientY };
    touchStartTime = Date.now();
    
    longPressTimer = setTimeout(() => {
      sendControl({ type: 'key', code: 'KEYCODE_MENU' });
      logEntry('Long press → Menu', 'info');
      touchStart = null;
    }, 600);
  });

  screenWrap.addEventListener('mousemove', (e) => {
    if (!touchStart) return;
    e.preventDefault();
    // Cancel long press if moved significantly
    const dx = Math.abs(e.clientX - touchStart.clientX);
    const dy = Math.abs(e.clientY - touchStart.clientY);
    if (dx > 8 || dy > 8) clearTimeout(longPressTimer);
  });

  screenWrap.addEventListener('mouseup', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN || !touchStart) return;
    e.preventDefault();
    clearTimeout(longPressTimer);

    const endCoords = getDeviceCoordinates(e.clientX, e.clientY);
    if (!endCoords) { touchStart = null; return; }

    const dx = Math.abs(endCoords.x - touchStart.coords.x);
    const dy = Math.abs(endCoords.y - touchStart.coords.y);
    const elapsed = Date.now() - touchStartTime;

    if (dx < 20 && dy < 20 && elapsed < 500) {
      // Tap
      sendControl({ type: 'touch', action: 'tap', x: endCoords.x, y: endCoords.y });
      showRipple(e.clientX, e.clientY);
      logEntry(`Tap (${endCoords.x}, ${endCoords.y})`, 'info');
    } else if (dx >= 20 || dy >= 20) {
      // Swipe
      sendControl({
        type: 'touch', action: 'swipe',
        x: touchStart.coords.x, y: touchStart.coords.y,
        x2: endCoords.x, y2: endCoords.y,
        duration: Math.min(elapsed, 300)
      });
      logEntry(`Swipe (${touchStart.coords.x},${touchStart.coords.y})→(${endCoords.x},${endCoords.y})`, 'info');
    }
    touchStart = null;
  });

  screenWrap.addEventListener('mouseleave', () => {
    clearTimeout(longPressTimer);
    touchStart = null;
  });

  // Touch events for mobile
  screenWrap.addEventListener('touchstart', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    e.preventDefault();
    const touch = e.touches[0];
    const coords = getDeviceCoordinates(touch.clientX, touch.clientY);
    if (!coords) return;
    touchStart = { coords, clientX: touch.clientX, clientY: touch.clientY };
    touchStartTime = Date.now();

    longPressTimer = setTimeout(() => {
      sendControl({ type: 'key', code: 'KEYCODE_MENU' });
      logEntry('Long press → Menu', 'info');
      touchStart = null;
    }, 600);
  });

  screenWrap.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    e.preventDefault();
    clearTimeout(longPressTimer);
  });

  screenWrap.addEventListener('touchend', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN || !touchStart) return;
    e.preventDefault();
    clearTimeout(longPressTimer);

    const touch = e.changedTouches[0];
    const endCoords = getDeviceCoordinates(touch.clientX, touch.clientY);
    if (!endCoords) { touchStart = null; return; }

    const dx = Math.abs(endCoords.x - touchStart.coords.x);
    const dy = Math.abs(endCoords.y - touchStart.coords.y);

    if (dx < 20 && dy < 20) {
      sendControl({ type: 'touch', action: 'tap', x: endCoords.x, y: endCoords.y });
      showRipple(touch.clientX, touch.clientY);
    } else {
      sendControl({
        type: 'touch', action: 'swipe',
        x: touchStart.coords.x, y: touchStart.coords.y,
        x2: endCoords.x, y2: endCoords.y,
        duration: 200
      });
    }
    touchStart = null;
  });

  // ── Navigation Buttons ─────────────────────────────────────────────────────
  document.getElementById('btn-back').addEventListener('click', () => {
    sendControl({ type: 'key', code: 'KEYCODE_BACK' });
    logEntry('Back', 'info');
  });
  document.getElementById('btn-home').addEventListener('click', () => {
    sendControl({ type: 'key', code: 'KEYCODE_HOME' });
    logEntry('Home', 'info');
  });
  document.getElementById('btn-recents').addEventListener('click', () => {
    sendControl({ type: 'key', code: 'KEYCODE_APP_SWITCH' });
    logEntry('Recents', 'info');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const keyMap = {
      'Escape': 'KEYCODE_BACK',
      'Home': 'KEYCODE_HOME',
      'F5': 'KEYCODE_APP_SWITCH',
    };

    if (keyMap[e.key]) {
      e.preventDefault();
      sendControl({ type: 'key', code: keyMap[e.key] });
      logEntry(`Key: ${e.key}`, 'info');
    }
  });

  // ── WebSocket URL ─────────────────────────────────────────────────────────
  function getWsUrl() {
    const loc = window.location;
    return (loc.protocol === 'https:')
      ? `wss://${loc.host}/ws`
      : `ws://${loc.host}/ws`;
  }

  function logEntry(msg, cls = 'info') {
    const el = document.createElement('div');
    el.className = `entry ${cls}`;
    el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.prepend(el);
    while (log.children.length > 80) log.removeChild(log.lastChild);
  }

  function setStatus(state, text) {
    badge.className = state;
    badge.textContent = text;
  }

  function connect() {
    const url = getWsUrl();
    wsDisplay.textContent = url;
    setStatus('connecting', 'Connecting…');
    logEntry(`Connecting to ${url}`, 'info');

    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';  // Faster than blob — no async conversion

    ws.onopen = () => {
      setStatus('connected', 'Streaming');
      btnConn.disabled = true;
      btnDisc.disabled = false;
      logEntry('Connected — Touch + nav controls active', 'ok');

      fpsTimer = setInterval(() => {
        if (frameCount > 0) {
          logEntry(`${frameCount} fps`, 'ok');
        }
        frameCount = 0;
      }, 1000);
    };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        // JSON control message from server
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'device_info') {
            deviceWidth = msg.width || 1080;
            deviceHeight = msg.height || 1920;
            logEntry(`Device: ${deviceWidth}×${deviceHeight}`, 'ok');
          }
        } catch(e) {}
        return;
      }

      // Binary frame data — render directly (no blob conversion)
      const blob = new Blob([event.data], { type: 'image/jpeg' });
      const url_ = URL.createObjectURL(blob);
      const prev = screen$.src;

      screen$.onload = () => {
        if (prev && prev.startsWith('blob:')) URL.revokeObjectURL(prev);
        placeholder.style.display = 'none';
        screen$.style.display     = 'block';
        frameCount++;
      };
      screen$.src = url_;
    };

    ws.onerror = () => {
      logEntry('WebSocket error — check server is running', 'warn');
    };

    ws.onclose = () => {
      setStatus('disconnected', 'Disconnected');
      btnConn.disabled = false;
      btnDisc.disabled = true;
      clearInterval(fpsTimer);
      logEntry('Connection closed.', 'warn');
    };
  }

  function disconnect() {
    if (ws) ws.close();
  }

  // ── Auto-connect on page load ─────────────────────────────────────────────
  window.addEventListener('load', () => {
    wsDisplay.textContent = getWsUrl();
    connect();
  });

  // ── Event bindings ───────────────────────────────────────────────────────
  btnConn.addEventListener('click', connect);
  btnDisc.addEventListener('click', disconnect);
  btnFull.addEventListener('click', () => {
    const wrap = document.getElementById('screen-wrap');
    if (document.fullscreenElement) document.exitFullscreen();
    else wrap.requestFullscreen();
  });
</script>
</body>
</html>
